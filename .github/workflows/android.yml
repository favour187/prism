name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'client/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'client/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant wrapper permission
        run: chmod +x android/gradlew

      - name: Test and build debug APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prism-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
