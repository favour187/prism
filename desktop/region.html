<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Prism — select region</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: #000; cursor: crosshair; user-select: none; }
  #frame { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: fill; pointer-events: none; }
  .dim { position: fixed; background: rgba(0,0,0,0.5); pointer-events: none; }
  #rect { position: fixed; border: 2px solid #38c6ff; border-radius: 2px; pointer-events: none; }
  #hint {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    background: rgba(12,14,20,.85); color: #fff; padding: 9px 16px; border-radius: 99px;
    font: 13px/1.4 -apple-system, system-ui, sans-serif; pointer-events: none; white-space: nowrap;
  }
  #hint kbd { background: rgba(255,255,255,.15); border-radius: 4px; padding: 1px 6px; font-size: 11px; }
</style>
</head>
<body>
  <img id="frame" alt="" />
  <div class="dim" id="dimTop"></div><div class="dim" id="dimLeft"></div>
  <div class="dim" id="dimRight"></div><div class="dim" id="dimBottom"></div>
  <div id="rect" hidden></div>
  <div id="hint">Drag to select a region · <kbd>Enter</kbd> capture · <kbd>Esc</kbd> cancel</div>

<script>
  const img = document.getElementById('frame');
  const rectEl = document.getElementById('rect');
  const dims = { top: dimTop, left: dimLeft, right: dimRight, bottom: dimBottom };
  const result = () => window.prismRegion.finish(dataUrlOrNull());

  let start = null, current = null, committed = false;

  function dataUrlOrNull() {
    if (!current) return null;
    const r = norm(current);
    if (r.w < 8 || r.h < 8) return null;
    const sx = img.naturalWidth / img.getBoundingClientRect().width;
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(r.w * sx);
    canvas.height = Math.round(r.h * sx);
    canvas.getContext('2d').drawImage(img, r.x * sx, r.y * sx, r.w * sx, r.h * sx, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/png');
  }

  function norm(sel) {
    return {
      x: Math.min(sel.x1, sel.x2), y: Math.min(sel.y1, sel.y2),
      w: Math.abs(sel.x2 - sel.x1), h: Math.abs(sel.y2 - sel.y1),
    };
  }

  function paint() {
    if (!current) { rectEl.hidden = true; for (const k in dims) dims[k].style.cssText = 'display:none'; return; }
    const r = norm(current);
    if (r.w < 2 || r.h < 2) return;
    rectEl.hidden = false;
    rectEl.style.cssText = `left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px`;
    dims.top.style.cssText = `left:0;top:0;width:100%;height:${r.y}px`;
    dims.left.style.cssText = `left:0;top:${r.y}px;width:${r.x}px;height:${r.h}px`;
    dims.right.style.cssText = `left:${r.x + r.w}px;top:${r.y}px;width:${innerWidth - r.x - r.w}px;height:${r.h}px`;
    dims.bottom.style.cssText = `left:0;top:${r.y + r.h}px;width:100%;height:${innerHeight - r.y - r.h}px`;
  }

  addEventListener('mousedown', (e) => { start = { x1: e.clientX, y1: e.clientY, x2: e.clientX, y2: e.clientY }; current = null; paint(); });
  addEventListener('mousemove', (e) => { if (!start || current) return; start.x2 = e.clientX; start.y2 = e.clientY; paintSel(start); });
  function paintSel(sel) {
    const r = norm(sel);
    if (r.w < 2 || r.h < 2) return;
    rectEl.hidden = false;
    rectEl.style.cssText = `left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px`;
    dims.top.style.cssText = `left:0;top:0;width:100%;height:${r.y}px`;
    dims.left.style.cssText = `left:0;top:${r.y}px;width:${r.x}px;height:${r.h}px`;
    dims.right.style.cssText = `left:${r.x + r.w}px;top:${r.y}px;width:${innerWidth - r.x - r.w}px;height:${r.h}px`;
    dims.bottom.style.cssText = `left:0;top:${r.y + r.h}px;width:100%;height:${innerHeight - r.y - r.h}px`;
  }
  addEventListener('mouseup', () => { if (start) { current = { ...start }; start = null; } });

  addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !committed) { committed = true; window.prismRegion.finish(null); }
    if (e.key === 'Enter' && current && !committed) { committed = true; result(); }
  });
  addEventListener('dblclick', () => { if (current && !committed) { committed = true; result(); } });

  window.prismRegion.onFrame((frame) => { img.src = frame.dataUrl; });
</script>
</body>
</html>
