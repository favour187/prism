# Render Blueprint — deploys Prism as a single web service.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: prism
    runtime: node
    plan: starter            # a disk-backed plan is recommended for SQLite persistence
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false          # set this in the Render dashboard (server-side secret)
      - key: GROQ_CHAT_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_STT_MODEL
        value: whisper-large-v3-turbo
      - key: DATA_DIR
        value: /var/data
    disk:
      name: prism-data
      mountPath: /var/data
      sizeGB: 1
